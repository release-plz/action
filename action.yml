name: "release-plz"
author: "Marco Ieni"
description: "Update version and changelog based on semantic versioning and conventional commits"
inputs:
  command:
    description: "The release-plz command to run. Accepted values: `release-pr`, `release`. If unspecified, this action runs both these commands."
    required: false
  registry:
    description: "Registry where the packages are stored. The registry name needs to be present in the Cargo config. If unspecified, crates.io is used."
    required: false
  config:
    description: "Config file location. If not present, the first existing file among 'release-plz.toml', '.release-plz.toml', and '.config/release-plz.toml' is used, in that order."
    required: false
  forge:
    description: "Git forge/backend. Valid values: 'github', 'gitea'. Defaults to 'github'."
    required: false
  backend:
    description: "Supported for backward compatibility. Use 'forge' instead."
    required: false
  manifest_path:
    description:
      "Path to the Cargo.toml of the project you want to update. If not provided, release-plz will use the Cargo.toml of the
      root directory. Both Cargo workspaces and single packages are supported."
    required: false
  project_manifest:
    description: "Deprecated. Use `manifest_path` instead."
    required: false
  version:
    description: "Release-plz version to use. (Default: `0.3.172`)."
    default: "0.3.172"
    required: false
  token:
    description: "Token used to publish to the cargo registry"
    required: false
  verbose:
    description: "Print module and source location in logs."
    required: false
  dry_run:
    description:
      "Add the `--dry-run` flag to the `release` command.
      If the input `command` is left unspecified (and so both `release` and `release-pr` are ran),
      the `--dry-run` flag is only added to the `release` command
      (the flag isn't added to the `release-pr` command).
      Useful if you're only interested in whether or not a release (pr) would be created."
    required: false
  cache:
    description: "Cache Cargo registry and Git dependency downloads. Only enable it if you trust every workflow that runs on your default branch or release branch: a poisoned cache could run code in the release-plz job, with access to its GitHub and registry tokens. (Default: `false`)."
    default: "false"
    required: false
outputs:
  # Useful for when https://github.com/release-plz/release-plz/issues/1029 is implemented.
  # For now, it just returns an array with `pr` in it.
  prs:
    description: "The release PRs opened by release-plz. (Not useful for now. Use `pr` instead)"
    value: ${{ steps.release-plz.outputs.prs }}
  pr:
    description: "The release PR opened by release-plz."
    value: ${{ steps.release-plz.outputs.pr }}
  releases:
    description: "The JSON output of the `release` command."
    value: ${{ steps.release-plz.outputs.releases }}
  prs_created:
    description: "Whether release-plz created any release PR."
    value: ${{ steps.release-plz.outputs.prs_created }}
  releases_created:
    description: "Whether release-plz released any package."
    value: ${{ steps.release-plz.outputs.releases_created }}
branding:
  icon: "zap"
  color: "yellow"
runs:
  using: "composite"
  steps:
    - name: Determine Cargo home
      if: ${{ inputs.cache == 'true' }}
      id: cargo-home
      shell: bash
      continue-on-error: true
      run: |
        cargo_home='~/.cargo'
        if [[ -n "${CARGO_HOME:-}" ]]; then
          # Cargo accepts relative paths and dot segments that actions/cache's
          # glob parser rejects. Resolve custom homes before passing them on.
          mkdir -p -- "$CARGO_HOME"
          cd -P -- "$CARGO_HOME"
          cargo_home=$PWD
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            cargo_home=$(cygpath -m "$cargo_home")
          fi
          # Cache paths are newline-delimited globs, not literal file paths.
          if [[ "$cargo_home" == *$'\n'* || "$cargo_home" == *$'\r'* ]]; then
            echo '::warning::Cannot cache a Cargo home containing line breaks.'
            exit 1
          fi
          cargo_home=${cargo_home//\\/\\\\}
          cargo_home=${cargo_home//\[/[[]}
          cargo_home=${cargo_home//\?/[?]}
          cargo_home=${cargo_home//\*/[*]}
        fi
        # Leave the default `~` for actions/cache to expand using the native home
        # directory, also on Windows where Bash HOME may differ from USERPROFILE.
        printf 'path=%s\n' "$cargo_home" >> "$GITHUB_OUTPUT"
    - name: Cache Cargo downloads
      if: ${{ inputs.cache == 'true' && steps.cargo-home.outcome == 'success' }}
      # Caching is only an optimization: never fail the release because of it.
      continue-on-error: true
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Cache downloads only: Cargo credentials, installed tools, extracted
        # sources, and target/build directories are deliberately excluded.
        path: |
          ${{ steps.cargo-home.outputs.path }}/registry/index
          ${{ steps.cargo-home.outputs.path }}/registry/cache
          ${{ steps.cargo-home.outputs.path }}/git/db
        key: release-plz-cargo-downloads-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          release-plz-cargo-downloads-v1-${{ runner.os }}-
    # Install cargo-semver-checks with install-action instead of cargo-binstall
    # to avoid checking crates-io
    - name: Install cargo-semver-checks
      uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
      with:
        tool: cargo-semver-checks@0.51
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # v1.25.3
      env:
        BINSTALL_VERSION: 1.25.3
    # Install release-plz using cargo-binstall instead of install-action because we
    # don't want to wait the 3 hour install-action release cadence before releasing a new
    # version of this action.
    - name: Install release-plz
      shell: bash
      run: |
        cargo-binstall \
            release-plz@${{ inputs.version }}\
            --force\
            --strategies=crate-meta-data,compile\
            --no-confirm
    - name: Configure git user from GitHub token
      if: ${{ (inputs.forge || inputs.backend || 'github') == 'github' }}
      uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4
    - name: Run release-plz
      id: release-plz
      shell: bash
      run: |
        if [[ -n "${{ inputs.config }}" ]]
        then
            echo "using config from '${{ inputs.config }}'"
            # Use arrays so that inputs can contain spaces
            CONFIG_PATH=("--config" "${{ inputs.config }}")
        else
            CONFIG_PATH=()
        fi

        if [[ -n "${{ inputs.verbose }}" ]]
        then
            VERBOSE=("-v")
        else
            VERBOSE=()
        fi

        if [[ -n "${{ inputs.dry_run }}" ]]
        then
            DRY_RUN=("--dry-run")
        else
            DRY_RUN=()
        fi

        if [[ -n "${{ inputs.token }}" ]]
        then
            echo "using custom registry token'"
            TOKEN=("--token" "${{ inputs.token }}")
        else
            TOKEN=()
        fi

        if [[ -n "${{ inputs.forge }}" ]]
        then
          echo "Using forge '${{ inputs.forge }}'"
          FORGE=("--forge" "${{ inputs.forge }}")
        elif [[ -n "${{ inputs.backend }}" ]]
        then
          echo "'backend' input is supported for backward compatibility. Use 'forge' instead."
          echo "Using forge '${{ inputs.backend }}'"
          FORGE=("--forge" "${{ inputs.backend }}")
        else
          echo "Using forge 'github'"
          FORGE=("--forge" "github")
        fi

        if [[ -n "${{ inputs.registry }}" ]]
        then
            echo "using registry '${{ inputs.registry }}'"
            ALT_REGISTRY=("--registry" "${{ inputs.registry }}")
        else
            ALT_REGISTRY=()
        fi

        if [[ -n "${{ inputs.manifest_path }}" ]]
        then
            echo "using manifest path '${{ inputs.manifest_path }}'"
            MANIFEST_PATH=("--manifest-path" "${{ inputs.manifest_path }}")
        elif [[ -n "${{ inputs.project_manifest }}" ]]
        then
            echo "using manifest path '${{ inputs.project_manifest }}'"
            MANIFEST_PATH=("--project-manifest" "${{ inputs.project_manifest }}")
        else
            MANIFEST_PATH=()
        fi

        if [[ -z "${{ inputs.command }}" || "${{ inputs.command }}" == "release-pr" ]]
        then
            echo "-- Running release-plz release-pr --"
            release_pr_output=$(release-plz release-pr\
                --git-token "${GITHUB_TOKEN}"\
                --repo-url "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}"\
                "${CONFIG_PATH[@]}"\
                "${ALT_REGISTRY[@]}"\
                "${MANIFEST_PATH[@]}"\
                "${FORGE[@]}"\
                "${VERBOSE[@]}"\
                -o json)
            echo "release_pr_output: $release_pr_output"
            prs=$(echo "$release_pr_output" | jq -c .prs)
            echo "prs=$prs" >> "$GITHUB_OUTPUT"
            prs_length=$(echo "$prs" | jq 'length')
            if [ "$prs_length" != "0" ]; then
                prs_created=true
                first_pr=$(echo "$prs" | jq -c .[0])
            else
                prs_created=false
                first_pr="{}"
            fi
            echo "pr=$first_pr" >> "$GITHUB_OUTPUT"
            echo "prs_created=$prs_created" >> "$GITHUB_OUTPUT"
        fi

        if [[ -z "${{ inputs.command }}" || "${{ inputs.command }}" == "release" ]]
        then
            echo "-- Running release-plz release --"
            release_output=$(release-plz release\
                --git-token "${GITHUB_TOKEN}"\
                "${CONFIG_PATH[@]}"\
                "${ALT_REGISTRY[@]}"\
                "${MANIFEST_PATH[@]}"\
                "${FORGE[@]}"\
                "${TOKEN[@]}"\
                "${VERBOSE[@]}"\
                "${DRY_RUN[@]}"\
                -o json)
            echo "release_output: $release_output"
            releases=$(echo $release_output | jq -c .releases)
            echo "releases=$releases" >> "$GITHUB_OUTPUT"
            releases_length=$(echo "$releases" | jq 'length')
            if [ "$releases_length" != "0" ]; then
                releases_created=true
            else
                releases_created=false
            fi
            echo "releases_created=$releases_created" >> "$GITHUB_OUTPUT"
        fi
